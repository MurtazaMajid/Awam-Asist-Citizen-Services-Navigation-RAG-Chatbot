services:
  - type: web
    name: awam-assist-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@10.26.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RAG_API_URL
        sync: false
      - key: RAG_API_KEY
        sync: false
